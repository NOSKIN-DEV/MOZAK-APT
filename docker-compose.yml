services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mozak-apt:local
    container_name: mozak-apt
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # El prototipo no tiene curl/wget en la imagen final (es node:22-slim
      # minimalista), así que el healthcheck usa el propio Node para pedir
      # la página principal.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Este archivo es el modo MOCK (por defecto): una sola pieza, sin base de datos.
# El modo PostgreSQL (servicio "db" con PostGIS, tarea "migrate" y la app
# apuntando a la base) está en docker-compose.postgres.yml y se superpone a
# este archivo: ver README → "Docker con PostgreSQL" o `npm run docker:postgres`.
