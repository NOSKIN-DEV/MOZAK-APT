services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: mozak-apt:local
    container_name: mozak-apt
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
    restart: unless-stopped
    healthcheck:
      # El prototipo no tiene curl/wget en la imagen final (es node:22-slim
      # minimalista), así que el healthcheck usa el propio Node para pedir
      # la página principal.
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

# Nota: el servicio "db" (PostgreSQL + PostGIS) descrito en el documento
# «Arquitectura del Sistema» corresponde a la épica futura "Persistencia
# PostgreSQL/PostGIS" (ver Planificación del Proyecto → Product Backlog),
# NO a esta Etapa 9. Hoy el prototipo usa datos mock en memoria
# (MockEventRepository), así que agregar un servicio "db" ahora sería
# infraestructura sin nada que la use. Se añadirá en esa épica futura,
# junto con la implementación de PostgresEventRepository.
